info:
  name: invalid_scope
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/currencies?scope=invalid"
  params:
    - name: scope
      value: invalid
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `scope` contains an unsupported value.

  ### Input
  `scope=invalid`

  ### Expected
  Determine whether the API rejects an unsupported scope value or falls back to default behavior.

  ### Actual
  HTTP `200`

  The response returns the normal currency collection.

  Example:

  ```json
  {
    "iso_code": "AED",
    "iso_numeric": "784",
    "name": "United Arab Emirates Dirham",
    "symbol": "د.إ",
    "start_date": "1996-04-11",
    "end_date": "2026-09-10"
  }
  ```
