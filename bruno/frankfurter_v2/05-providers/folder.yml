docs:
  content: |-
    ## Providers

    Test coverage for the `/providers` endpoint.

    The endpoint lists the exchange-rate data sources available through the API and provides metadata describing their coverage.

    | Scenario | Input | Result |
    | --- | --- | --- |
    | Retrieve providers | `/providers` | `200`  provider list returned |

    ### Observations

    - The endpoint returns an array of provider objects.
    - Each provider is identified by a `key` that can be used with provider filtering on rate endpoints.
    - Provider metadata includes information such as `name`, `country_code`, `rate_type`, and `pivot_currency`.
    - Historical coverage is described through `start_date` and `end_date`.
    - Provider entries include supported currencies.
    - Publication metadata includes fields such as `publish_cadence` and `publishes_missed`.
    - Source information can include `data_url` and `terms_url`.
  type: text/markdown
