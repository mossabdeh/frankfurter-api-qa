info:
  name: case_sensitivity
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/currency/dZd"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify whether the currency code path parameter is case-sensitive.

  ### Input
  Currency code: `dZd`

  ### Expected
  Determine whether case variations of a valid currency code are accepted.

  ### Actual
  HTTP `200`

  The API successfully returns the Algerian Dinar currency details.

  ### Observation
  Currency codes are case-insensitive in the tested request.

  `DZD` and `dZd` are both accepted successfully.
