info:
  name: invalid_code
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/currency/XYZ"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  
  ### Objective
  Verify API behavior when an unsupported currency code is requested.

  ### Input
  Currency code: `XYZ`

  ### Expected
  The request should fail because the requested currency does not exist.

  ### Actual
  HTTP `404`

  ```json
  {
    "status": 404,
    "message": "not found"
  }
  ```
