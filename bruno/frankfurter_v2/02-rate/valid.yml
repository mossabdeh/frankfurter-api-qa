info:
  name: valid
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rate/USD/EUR"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that a rate can be retrieved for a valid currency pair.

  ### Input
  Base currency: `USD`

  Quote currency: `EUR`

  ### Expected
  The request should succeed and return a single USD/EUR exchange-rate object.

  ### Actual
  HTTP `200`

  ```json
  {
    "date": "2026-09-10",
    "base": "USD",
    "quote": "EUR",
    "rate": 0.85974
  }
  ```
