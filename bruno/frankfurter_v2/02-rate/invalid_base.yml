info:
  name: invalid_base
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/rate/XYZ/EUR"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when the base currency in the currency pair is unsupported.

  ### Input
  Base currency: `XYZ`

  Quote currency: `EUR`

  ### Expected
  The request should be rejected because the base currency is unsupported.

  ### Actual
  HTTP `422`

  ```json
  {
    "status": 422,
    "message": "invalid currency: XYZ"
  }
  ```
