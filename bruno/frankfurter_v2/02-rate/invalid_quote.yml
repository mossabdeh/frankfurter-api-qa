info:
  name: invalid_quote
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rate/USD/XYZ"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when the quote currency in the currency pair is unsupported.

  ### Input
  Base currency: `USD`

  Quote currency: `XYZ`

  ### Expected
  The request should be rejected because the quote currency is unsupported.

  ### Actual
  HTTP `422`

  ```json
  {
    "status": 422,
    "message": "invalid currency: XYZ"
  }
  ```
