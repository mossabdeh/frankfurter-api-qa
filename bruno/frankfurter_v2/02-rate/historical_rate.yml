info:
  name: historical_rate
  type: http
  seq: 5

http:
  method: GET
  url: "{{base}}/rate/EUR/USD?date=2026-01-02"
  params:
    - name: date
      value: 2026-01-02
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that a historical rate can be retrieved for a single currency pair.

  ### Input
  Base currency: `EUR`

  Quote currency: `USD`

  `date=2026-01-02`

  ### Expected
  The request should succeed and return the EUR/USD exchange rate for the requested historical date.

  ### Actual
  HTTP `200`

  ```json
  {
    "date": "2026-01-02",
    "base": "EUR",
    "quote": "USD",
    "rate": 1.1741
  }
  ```
