info:
  name: accept_header
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-01&quotes=USD"
  headers:
    - name: Accept
      value: application/x-ndjson
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that exchange-rate data can be returned in NDJSON format using the `Accept` header.

  ### Input
  `from=2026-01-01`

  `quotes=USD`

  Header:

  `Accept: application/x-ndjson`

  ### Expected
  The request should succeed and return exchange-rate data in NDJSON format.

  Each line should contain one independent JSON object.

  ### Actual
  HTTP `200`

  The response is returned in NDJSON format.

  Each line contains one independent JSON object rather than being wrapped in a JSON array.

  The `quotes=USD` filter is respected and multiple time-series records are returned as separate lines.
