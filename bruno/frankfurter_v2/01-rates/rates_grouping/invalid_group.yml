info:
  name: invalid_group
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-01&group=day&quotes=USD"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: group
      value: day
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `group` contains an unsupported grouping value.

  ### Input
  `from=2026-01-01`

  `group=day`

  `quotes=USD`

  ### Expected
  The request should be rejected because `day` is not a supported grouping value.

  ### Actual
  HTTP `422`

  ```json
  {
    "status": 422,
    "message": "invalid group"
  }
  ```
