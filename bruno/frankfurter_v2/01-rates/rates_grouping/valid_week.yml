info:
  name: valid_week
  type: http
  seq: 5

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-01&group=week&quotes=USD"
  params:
    - name: from
      value: 2026-01-01
      type: query
    - name: group
      value: week
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that a time series can be downsampled using weekly grouping.

  ### Input
  `from=2026-01-01`

  `group=week`

  `quotes=USD`

  ### Expected
  The request should succeed and return USD exchange-rate data downsampled by week.

  ### Actual
  HTTP `200`

  The response returns one USD rate per weekly interval, with dates progressing in 7-day intervals starting from `2026-01-01`.

  Example intervals:
  - `2026-01-01`
  - `2026-01-08`

  The `quotes=USD` filter is respected.

  ### Observation
  The grouped date represents the weekly interval in the downsampled series and should not be interpreted as proof of a raw daily observation for that exact date.
