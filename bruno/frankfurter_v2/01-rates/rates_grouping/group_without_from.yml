info:
  name: group_without_from
  type: http
  seq: 4

http:
  method: GET
  url: "{{base}}/rates?group=month&quotes=USD"
  params:
    - name: group
      value: month
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `group` is provided without a time-series start date.

  ### Input
  `group=month`

  `quotes=USD`

  ### Expected
  Determine whether `group` requires a time-series range or can be used without `from`.

  ### Actual
  HTTP `200`

  ```json
  [
    {
      "date": "2026-09-10",
      "base": "EUR",
      "quote": "USD",
      "rate": 1.1631
    }
  ]
  ```
