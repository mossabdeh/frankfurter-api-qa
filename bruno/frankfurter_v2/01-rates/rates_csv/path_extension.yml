info:
  name: path_extension
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rates.csv?quotes=USD"
  params:
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that exchange-rate data can be returned in CSV format using the `.csv` path extension.

  ### Input
  `/rates.csv`

  `quotes=USD`

  ### Expected
  The request should succeed and return the exchange-rate response in CSV format.

  ### Actual
  HTTP `200`

  ```csv
  date,base,quote,rate
  2026-09-10,EUR,USD,1.1631
  ```
