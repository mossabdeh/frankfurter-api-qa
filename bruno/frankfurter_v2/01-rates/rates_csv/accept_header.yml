info:
  name: accept_header
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/rates?quotes=USD"
  headers:
    - name: Accept
      value: text/csv
  params:
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that exchange-rate data can be returned in CSV format using the `Accept` header.

  ### Input
  `/rates?quotes=USD`

  Header:

  `Accept: text/csv`

  ### Expected
  The request should succeed and return the exchange-rate response in CSV format.

  ### Actual
  HTTP `200`

  ```csv
  date,base,quote,rate
  2026-09-10,EUR,USD,1.1631
  ```
