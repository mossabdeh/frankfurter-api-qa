info:
  name: valid
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?expand=providers"
  params:
    - name: expand
      value: providers
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that provider attribution can be included in exchange-rate responses.

  ### Input
  `expand=providers`

  ### Expected
  The request should succeed and enrich the returned rates with provider attribution information.

  ### Actual
  HTTP `200`

  The response includes provider attribution information for the returned exchange rates.

  ### Observation
  The `expand=providers` parameter enriches the standard rate response with information about the providers contributing to the rate.
