info:
  name: invalid_format
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/rates?date=04-01-1994"
  params:
    - name: date
      value: 04-01-1994
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `date` does not follow the documented `YYYY-MM-DD` format.

  ### Input 1
  `date=04-01-1994`

  ### Expected
  The date does not follow the documented format and should not be interpreted as a valid historical date.

  ### Actual
  HTTP `200`

  ```json
  []
  ```
