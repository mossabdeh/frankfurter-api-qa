info:
  name: rates
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rates"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that the default exchange-rate collection can be retrieved without optional query parameters.

  ### Input
  `/rates`

  ### Expected
  The request should succeed and return the currently available exchange rates using the API's default behavior.

  ### Actual
  HTTP `200`

  The response returns the current exchange-rate collection.
