info:
  name: case_sensitivity
  type: http
  seq: 6

http:
  method: GET
  url: "{{base}}/rates?quotes=Usd,eUr"
  params:
    - name: quotes
      value: Usd,eUr
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify whether currency codes provided through `quotes` are case-sensitive.

  ### Input
  `quotes=Usd,eUr`

  ### Expected
  Determine whether currency codes require uppercase formatting or are accepted regardless of case.

  ### Actual
  HTTP `200`

  The API accepts mixed-case currency codes and successfully returns the requested rates.

  Currency codes in the `quotes` parameter are handled case-insensitively.
