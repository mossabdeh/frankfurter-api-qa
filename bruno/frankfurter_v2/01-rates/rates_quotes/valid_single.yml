info:
  name: valid_single
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rates?quotes=USD"
  params:
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that rates can be filtered by one valid target currency.

  ### Input
  `quotes=USD`

  ### Expected
  The request should succeed and return only the USD quote.

  ### Actual
  HTTP `200`

  The response contains only the requested `USD` quote.
