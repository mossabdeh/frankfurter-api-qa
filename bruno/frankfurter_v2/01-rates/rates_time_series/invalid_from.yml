info:
  name: invalid_from
  type: http
  seq: 5

http:
  method: GET
  url: "{{base}}/rates?from=hello&to=2026-01-05&quotes=USD"
  params:
    - name: from
      value: hello
      type: query
    - name: to
      value: 2026-01-05
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when the `from` parameter contains an invalid date value.

  ### Input
  `from=hello`

  `to=2026-01-05`

  `quotes=USD`

  ### Expected
  The request should be rejected because `from` cannot be interpreted as a valid date.

  ### Actual
  HTTP `422`

  ```json
  {
    "status": 422,
    "message": "invalid date"
  }
  ```
