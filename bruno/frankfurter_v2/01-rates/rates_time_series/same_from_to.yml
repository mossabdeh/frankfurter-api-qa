info:
  name: same_from_to
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-02&to=2026-01-02&quotes=USD"
  params:
    - name: from
      value: 2026-01-02
      type: query
    - name: to
      value: 2026-01-02
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `from` and `to` contain the same valid date.

  ### Input
  `from=2026-01-02`

  `to=2026-01-02`

  `quotes=USD`

  ### Expected
  The request should succeed and return the exchange rate for the specified date only.

  ### Actual
  HTTP `200`

  The response contains exactly one USD exchange rate for `2026-01-02`.

  The API accepts an identical `from` and `to` date as a valid single-day range.
