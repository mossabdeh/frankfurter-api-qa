info:
  name: valid_from_to
  type: http
  seq: 2

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-02&to=2026-01-05&quotes=USD"
  params:
    - name: from
      value: 2026-01-02
      type: query
    - name: to
      value: 2026-01-05
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that a time series can be retrieved for a valid date range.

  ### Input
  `from=2026-01-02`

  `to=2026-01-05`

  `quotes=USD`

  ### Expected
  The request should succeed and return USD exchange rates within the requested date range.

  ### Actual
  HTTP `200`

  The response returns USD exchange rates from `2026-01-02` through `2026-01-05`.

  All returned dates are within the requested range and the `quotes=USD` filter is respected.
