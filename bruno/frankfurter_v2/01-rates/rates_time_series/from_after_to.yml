info:
  name: from_after_to
  type: http
  seq: 4

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-05&to=2026-01-02&quotes=USD"
  params:
    - name: from
      value: 2026-01-05
      type: query
    - name: to
      value: 2026-01-02
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when the `from` date is later than the `to` date.

  ### Input
  `from=2026-01-05`

  `to=2026-01-02`

  `quotes=USD`

  ### Expected
  Determine how the API handles a reversed date range where `from` is later than `to`.

  ### Actual
  HTTP `200`

  ```json
  []
  ```
