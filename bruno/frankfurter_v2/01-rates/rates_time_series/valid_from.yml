info:
  name: valid_from
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-02&quotes=USD"
  params:
    - name: from
      value: 2026-01-02
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that a time series can be retrieved from a valid start date.

  ### Input
  `from=2026-01-02`

  `quotes=USD`

  ### Expected
  The request should succeed and return USD exchange rates starting from the requested date.

  ### Actual
  HTTP `200`

  The response starts at `2026-01-02` and returns USD exchange rates for subsequent dates.

  Example:

  ```json
  {
    "date": "2026-01-02",
    "base": "EUR",
    "quote": "USD",
    "rate": 1.1741
  }
  ```
