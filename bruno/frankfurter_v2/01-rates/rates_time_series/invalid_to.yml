info:
  name: invalid_to
  type: http
  seq: 6

http:
  method: GET
  url: "{{base}}/rates?from=2026-01-02&to=hello&quotes=USD"
  params:
    - name: from
      value: 2026-01-02
      type: query
    - name: to
      value: hello
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when the `to` parameter contains an invalid date value.

  ### Input
  `from=2026-01-02`

  `to=hello`

  `quotes=USD`

  ### Expected
  The request should be rejected because `to` cannot be interpreted as a valid date.

  ### Actual
  HTTP `422`

  ```json
  {
    "status": 422,
    "message": "invalid date"
  }
  ```
