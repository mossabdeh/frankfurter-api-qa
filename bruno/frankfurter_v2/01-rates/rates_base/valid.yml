info:
  name: valid
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?base=USD"
  params:
    - name: base
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that exchange rates can be retrieved using a valid supported base currency.

  ### Input
  `base=USD`

  ### Expected
  The request should be successful and return exchange rates using USD as the base currency.

  ### Actual
  HTTP `200`

  The response returns exchange rates with `USD` as the base currency.
