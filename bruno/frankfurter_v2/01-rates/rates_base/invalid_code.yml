info:
  name: invalid_code
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?base=XYZ"
  params:
    - name: base
      value: XYZ
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `base` contains an unsupported currency code.

  ### Input
  `base=XYZ`

  ### Expected
  The request should be rejected with a validation error.

  ### Actual
  HTTP `422`

  `invalid currency: XYZ`
