info:
  name: numeric
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?base=123"
  params:
    - name: base
      value: "123"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify API behavior when `base` contains a numeric value instead of a currency code.

  ### Input
  `base=123`

  ### Expected
  The request should be rejected with a validation error.

  ### Actual
  HTTP `422`

  `invalid currency: 123`
