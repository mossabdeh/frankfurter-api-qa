info:
  name: case_sensitivity
  type: http
  seq: 3

http:
  method: GET
  url: "{{base}}/rates?base=usd"
  params:
    - name: base
      value: usd
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify whether the `base` currency code is case-sensitive.

  ### Input
  `base=usd`  
  `base=UsD`

  ### Expected
  Determine whether currency codes require uppercase formatting or are normalized by the API.

  ### Actual
  Both requests return HTTP `200`.

  The API accepts mixed/lowercase currency codes and normalizes them successfully.
