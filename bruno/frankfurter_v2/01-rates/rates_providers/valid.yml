info:
  name: valid
  type: http
  seq: 1

http:
  method: GET
  url: "{{base}}/rates?providers=ECB&quotes=USD"
  params:
    - name: providers
      value: ECB
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify that exchange rates can be filtered using a valid provider.

  ### Input
  `providers=ECB`

  `quotes=USD`

  ### Expected
  The request should succeed and return the USD exchange rate using the specified ECB provider.

  ### Actual
  HTTP `200`

  ```json
  [
    {
      "date": "2026-09-08",
      "base": "EUR",
      "quote": "USD",
      "rate": 1.1614
    }
  ]
  ```
