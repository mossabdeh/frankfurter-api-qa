info:
  name: case_sensitivity
  type: http
  seq: 4

http:
  method: GET
  url: "{{base}}/rates?providers=ecb&quotes=USD"
  params:
    - name: providers
      value: ecb
      type: query
    - name: quotes
      value: USD
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### Objective
  Verify whether provider keys are case-sensitive.

  ### Input
  `providers=ecb`

  `providers=Ecb`

  `quotes=USD`

  ### Expected
  Determine whether provider filtering accepts case variations of a valid provider key.

  ### Actual
  HTTP `200`

  Both lowercase and mixed-case variations successfully return the EUR/USD exchange rate.

  ### Observation
  Provider keys are case-insensitive in the tested requests.

  `ECB`, `ecb`, and `Ecb` are accepted successfully.
